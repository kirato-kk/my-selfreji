<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELF-CHECKOUT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background-color: #1a1a2e; color: #ffffff; border-radius: 15px; }
    h1 { text-align: center; color: #00fff5; margin-bottom: 5px; }
    #interactive.viewport { width: 100%; height: 250px; background-color: #000; border: 2px solid #00fff5; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
    .cart { background: #0f3460; padding: 15px; border-radius: 10px; min-height: 120px; border: 1px solid #00fff5; }
    .total { font-size: 22px; font-weight: bold; text-align: right; margin-top: 15px; color: #ff2e63; }
    .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
    .pay-btn { background-color: #ff2e63; }
    .undo-btn { background-color: #ff9900; }
    .history-btn { background-color: #00adb5; }
    .reset-btn { display: block; margin: 20px auto 0; background: transparent; color: #aaa; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; z-index: 100; }
    .receipt { background: #ffffff; color: #333333; font-family: 'Courier New', monospace; padding: 25px; width: 300px; max-height: 80vh; overflow-y: auto; border-radius: 5px; }
    .receipt-item { display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; }
    .close-btn { width: 100%; padding: 10px; margin-top: 15px; background: #333; color: white; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h1>SELF-CHECKOUT</h1>
  <div id="interactive" class="viewport"></div>

  <div class="cart" id="cart-list">
    <p style="color: #888;">スキャンした商品がここに表示されます</p>
  </div>
  <div class="total">合計: <span id="total-price">0</span> 円</div>

  <button class="btn undo-btn" onclick="removeLastItem()">直前のスキャンを取り消す</button>
  <button class="btn pay-btn" onclick="pay()">お会計する</button>
  <button class="btn history-btn" onclick="showSalesHistory()">売上履歴を見る</button>
  
  <div style="margin-top:20px; border-top:1px solid #333; padding-top:10px;">
    <button class="reset-btn" onclick="resetSalesOnly()">売上記録だけリセット</button>
    <button class="reset-btn" onclick="resetAllData()" style="border-color:#ff2e63; color:#ff2e63;">すべて（商品データ含む）リセット</button>
  </div>

  <!-- ポップアップ類 -->
  <div class="modal-overlay" id="receipt-modal">
    <div class="receipt">
      <h2>RECEIPT</h2>
      <div id="receipt-items"></div>
      <div class="receipt-total" id="receipt-total-price"></div>
      <button class="close-btn" onclick="location.reload()">閉じる</button>
    </div>
  </div>

  <div class="modal-overlay" id="history-modal">
    <div class="receipt">
      <h2>SALES HISTORY</h2>
      <div id="history-list"></div>
      <button class="close-btn" onclick="closeHistory()">閉じる</button>
    </div>
  </div>

  <script>
    let totalPrice = 0;
    let isFirst = true;
    let cartHistory = []; 
    let itemDatabase = JSON.parse(localStorage.getItem('myPosDatabase')) || {
        "4901330502880": { name: "ポテトチップス", price: 160 },
        "4902102072618": { name: "コカ・コーラ 500ml", price: 150 }
    };
    let salesHistory = JSON.parse(localStorage.getItem('myPosSalesHistory')) || [];

    function playSound(freq, duration) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function addItem(name, price) {
      playSound(1200, 0.08);
      if (isFirst) { document.getElementById('cart-list').innerHTML = ''; isFirst = false; }
      const taxPrice = Math.round(price * 1.1);
      const itemEl = document.createElement('p');
      itemEl.textContent = `▶ ${name} : ${taxPrice}円`;
      document.getElementById('cart-list').appendChild(itemEl);
      cartHistory.push({ name: name, price: taxPrice, element: itemEl });
      totalPrice += taxPrice;
      document.getElementById('total-price').textContent = totalPrice;
    }

    // 売上記録のみリセット
    function resetSalesOnly() {
      if (confirm('売上記録だけをリセットしますか？\n（登録した商品は消えません）')) {
        localStorage.removeItem('myPosSalesHistory');
        alert('売上記録をリセットしました。');
        location.reload();
      }
    }

    // 全データリセット
    function resetAllData() {
      if (confirm('すべて（商品・売上データ）を初期化しますか？')) {
        localStorage.removeItem('myPosDatabase');
        localStorage.removeItem('myPosSalesHistory');
        location.reload();
      }
    }

    // 決済処理
    function pay() {
      if (cartHistory.length === 0) return;
      const saleRecord = { date: new Date().toLocaleString(), items: cartHistory, total: totalPrice };
      salesHistory.push(saleRecord);
      localStorage.setItem('myPosSalesHistory', JSON.stringify(salesHistory));
      
      document.getElementById('receipt-items').innerHTML = cartHistory.map(i => `<div class="receipt-item"><span>${i.name}</span><span>￥${i.price}</span></div>`).join('');
      document.getElementById('receipt-total-price').textContent = `合計: ￥${totalPrice}`;
      document.getElementById('receipt-modal').style.display = 'flex';
    }

    // 履歴表示
    function showSalesHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = salesHistory.length === 0 ? '記録なし' : '';
      salesHistory.forEach((sale, i) => {
        container.innerHTML += `<div style="margin-bottom:10px;"><small>#${i+1} ${sale.date}</small><br>${sale.items.map(it=>it.name).join(', ')} <br><strong>￥${sale.total}</strong></div>`;
      });
      document.getElementById('history-modal').style.display = 'flex';
    }
    function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }
    function removeLastItem() { location.reload(); } // 簡易リセット用
    
    Quagga.init({ inputStream: { type: "LiveStream", target: document.querySelector('#interactive') }, decoder: { readers: ["ean_reader"] } }, (err) => { if(!err) Quagga.start(); });
    Quagga.onDetected((res) => {
      const code = res.codeResult.code;
      if(itemDatabase[code]) addItem(itemDatabase[code].name, itemDatabase[code].price);
    });
  </script>
</body>
</html>
