<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELF-CHECKOUT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background-color: #1a1a2e; color: #ffffff; border-radius: 15px; }
    h1 { text-align: center; color: #00fff5; margin-bottom: 5px; }
    .status { text-align: center; color: #00fff5; margin-bottom: 10px; font-weight: bold; }
    #interactive.viewport { width: 100%; height: 250px; background-color: #000; border: 2px solid #00fff5; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
    .cart { background: #0f3460; padding: 15px; border-radius: 10px; min-height: 120px; border: 1px solid #00fff5; }
    .total { font-size: 22px; font-weight: bold; text-align: right; margin-top: 15px; color: #ff2e63; }
    .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
    .pay-btn { background-color: #ff2e63; }
    .undo-btn { background-color: #ff9900; }
    .history-btn { background-color: #00adb5; }
    .edit-btn { background-color: #6c5ce7; }
    .reset-btn { display: block; margin: 10px auto 0; background: transparent; color: #aaa; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; z-index: 100; }
    .receipt { background: #ffffff; color: #333333; font-family: 'Courier New', monospace; padding: 25px; width: 300px; max-height: 80vh; overflow-y: auto; border-radius: 5px; }
    .receipt h2 { text-align: center; margin: 0 0 10px 0; font-size: 20px; }
    .receipt-item { display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; }
    .close-btn { width: 100%; padding: 10px; margin-top: 15px; background: #333; color: white; border: none; font-weight: bold; cursor: pointer; }
    .small-btn { font-size: 12px; padding: 3px 8px; margin-left: 5px; cursor: pointer; border: none; border-radius: 3px; }
  </style>
</head>
<body>

  <h1>SELF-CHECKOUT</h1>
  <div class="status" id="status-msg">カメラにかざしてください</div>
  <div id="interactive" class="viewport"></div>

  <h2>購入リスト</h2>
  <div class="cart" id="cart-list"><p style="color: #888;">スキャンした商品がここに表示されます</p></div>
  <div class="total">合計 (税込): <span id="total-price">0</span> 円</div>

  <button class="btn undo-btn" onclick="removeLastItem()">直前のスキャンを取り消す</button>
  <button class="btn pay-btn" onclick="pay()">お会計</button>
  <button class="btn history-btn" onclick="showSalesHistory()">売上履歴</button>
  <button class="btn edit-btn" onclick="openDatabaseManager()">商品を編集・削除</button>

  <div style="margin-top:20px; border-top:1px solid #333; padding-top:10px;">
    <button class="reset-btn" onclick="resetSalesOnly()">売上記録のみリセット</button>
    <button class="reset-btn" onclick="resetAllData()" style="border-color:#ff2e63; color:#ff2e63;">すべてリセット</button>
  </div>

  <!-- レシート表示画面 -->
  <div class="modal-overlay" id="receipt-modal">
    <div class="receipt">
      <h2>レシート</h2>
      <div id="receipt-items"></div>
      <hr>
      <div id="receipt-total" style="font-weight:bold; text-align:right;"></div>
      <button class="close-btn" onclick="closeReceipt()">閉じる</button>
    </div>
  </div>

  <!-- 商品管理画面 -->
  <div class="modal-overlay" id="manager-modal">
    <div class="receipt">
      <h2>商品管理</h2>
      <div id="manager-list"></div>
      <button class="close-btn" onclick="closeManager()">閉じる</button>
    </div>
  </div>

  <!-- 売上履歴画面 -->
  <div class="modal-overlay" id="history-modal">
    <div class="receipt">
      <h2>売上履歴</h2>
      <div id="history-list"></div>
      <button class="close-btn" onclick="closeHistory()">閉じる</button>
    </div>
  </div>

  <script>
    const SALES_PASSWORD = "4869"; 
    let canScan = true, totalPrice = 0, isFirst = true, cartHistory = []; 
    let itemDatabase = JSON.parse(localStorage.getItem('myPosDatabase')) || { "4901330502880": { name: "ポテトチップス", price: 160 } };
    let salesHistory = JSON.parse(localStorage.getItem('myPosSalesHistory')) || [];

    // 音声効果
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    // 商品管理画面（パスワード保護）
     // 商品管理を開く（最初に1回だけパスワード確認）
    function openDatabaseManager() {
      const input = prompt("管理用パスワードを入力:");
      if (input !== SALES_PASSWORD) { 
        if (input !== null) alert("パスワードが違います"); 
        return; 
      }
      renderManagerList();
      document.getElementById('manager-modal').style.display = 'flex';
    }

    // 管理画面のリストを描画（パスワード確認なし）
    function renderManagerList() {
      const container = document.getElementById('manager-list');
      container.innerHTML = '';
      for (let code in itemDatabase) {
        const item = itemDatabase[code];
        container.innerHTML += `<div style="margin-bottom:10px;"><strong>${item.name}</strong> (${item.price}円) <button class="small-btn" onclick="editItem('${code}')">✏️</button><button class="small-btn" onclick="deleteItem('${code}')" style="background:#ff7675;">❌</button></div>`;
      }
    }
    
    function closeManager() { document.getElementById('manager-modal').style.display = 'none'; }
    
    // 編集機能（パスワード確認なしで更新）
    function editItem(code) {
      const n = prompt("新しい商品名:", itemDatabase[code].name);
      if (n) {
        const p = Number(prompt("新しい価格:", itemDatabase[code].price));
        if (!isNaN(p)) { 
          itemDatabase[code] = { name: n, price: p }; 
          localStorage.setItem('myPosDatabase', JSON.stringify(itemDatabase)); 
          renderManagerList(); // パスワード再入力なしでリストを再描画
        }
      }
    }
    
    // 削除機能（パスワード確認なしで更新）
    function deleteItem(code) {
      if (confirm(`${itemDatabase[code].name} を削除しますか？`)) {
        delete itemDatabase[code]; 
        localStorage.setItem('myPosDatabase', JSON.stringify(itemDatabase)); 
        renderManagerList(); // パスワード再入力なしでリストを再描画
      }
    }


    
    function closeManager() { document.getElementById('manager-modal').style.display = 'none'; }
    function closeReceipt() { document.getElementById('receipt-modal').style.display = 'none'; location.reload(); }
    function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }
    
    function editItem(code) {
      const n = prompt("新しい商品名", itemDatabase[code].name);
      if (n) {
        const p = Number(prompt("新しい価格", itemDatabase[code].price));
        if (!isNaN(p)) { itemDatabase[code] = { name: n, price: p }; localStorage.setItem('myPosDatabase', JSON.stringify(itemDatabase)); openDatabaseManager(); }
      }
    }
    
    function deleteItem(code) {
      if (confirm(`${itemDatabase[code].name} を削除しますか？`)) {
        delete itemDatabase[code]; localStorage.setItem('myPosDatabase', JSON.stringify(itemDatabase)); openDatabaseManager();
      }
    }

    // カート追加処理
    function addItem(name, price) {
      playSound(1200, 0.08);
      if (isFirst) { document.getElementById('cart-list').innerHTML = ''; isFirst = false; }
      const taxPrice = Math.round(price * 1.1);
      const itemEl = document.createElement('p');
      itemEl.textContent = `▶ ${name} : ${price}円 (税込${taxPrice}円)`;
      cartHistory.push({ name: name, price: price, taxPrice: taxPrice, element: itemEl });
      document.getElementById('cart-list').appendChild(itemEl);
      totalPrice += taxPrice;
      document.getElementById('total-price').textContent = totalPrice;
    }

    function removeLastItem() {
      if (cartHistory.length > 0) {
        const last = cartHistory.pop();
        last.element.remove();
        totalPrice -= last.taxPrice;
        document.getElementById('total-price').textContent = totalPrice;
      }
    }

    // お会計処理
    // お会計処理（商品名・価格の内訳も売上履歴に保存する）
    function pay() {
      if (cartHistory.length === 0) return;

      // レシート表示の作成
      const container = document.getElementById('receipt-items');
      container.innerHTML = cartHistory.map(i => `<div class="receipt-item"><span>${i.name}</span><span>${i.taxPrice}円</span></div>`).join('');
      document.getElementById('receipt-total').textContent = `合計: ${totalPrice}円`;
      document.getElementById('receipt-modal').style.display = 'flex';

      // ★修正箇所：購入された商品名と価格のリストを作成
      const itemsPurchased = cartHistory.map(i => `${i.name} (${i.taxPrice}円)`).join(', ');

      // 売上履歴に「購入商品リスト」も追加して保存
      salesHistory.push({
        date: new Date().toLocaleString(),
        total: totalPrice,
        items: itemsPurchased // 商品名を記録
      });
      localStorage.setItem('myPosSalesHistory', JSON.stringify(salesHistory));
    }


    // 売上履歴表示（パスワード保護）
    // 売上履歴表示（商品名も一覧に表示する）
    function showSalesHistory() {
      const input = prompt("管理用パスワードを入力:");
      if (input === SALES_PASSWORD) {
        const historyContainer = document.getElementById('history-list');

        if (salesHistory.length === 0) {
          historyContainer.innerHTML = "履歴なし";
        } else {
          // ★修正箇所：日時・合計金額だけでなく、購入した商品名も表示する
          historyContainer.innerHTML = salesHistory.map(s => {
            const itemList = s.items ? `<br><small style="color:#666;">内訳: ${s.items}</small>` : '';
            return `<div style="margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 5px;">
                      <strong>${s.date}</strong><br>
                      合計: ${s.total}円 ${itemList}
                    </div>`;
          }).join('');
        }

        document.getElementById('history-modal').style.display = 'flex';
      } else if (input !== null) {
        alert("パスワードが違います");
      }
    }


    function resetSalesOnly() { if(confirm("売上記録を削除しますか？")){ localStorage.removeItem('myPosSalesHistory'); location.reload(); } }
    function resetAllData() { if(confirm("すべての登録データと売上を削除しますか？")){ localStorage.clear(); location.reload(); } }

    // Quaggaカメラ読み取り設定
    Quagga.init({
      inputStream: { type: "LiveStream", target: document.querySelector('#interactive'), constraints: { facingMode: "environment" } },
      decoder: { readers: ["ean_reader", "ean_8_reader"] }
    }, (err) => { if (!err) Quagga.start(); });

    Quagga.onDetected((res) => {
      if (!canScan) return;
      const code = res.codeResult.code;
      canScan = false;
      if (itemDatabase[code]) {
        addItem(itemDatabase[code].name, itemDatabase[code].price);
      } else {
        const n = prompt("【新規商品】商品名を入力");
        if (n) {
          const p = Number(prompt("価格を入力"));
          if (!isNaN(p)) {
            itemDatabase[code] = { name: n, price: p };
            localStorage.setItem('myPosDatabase', JSON.stringify(itemDatabase));
            addItem(n, p);
          }
        }
      }
      setTimeout(() => { canScan = true; }, 1500);
    });
  </script>
</body>
</html>
