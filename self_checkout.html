<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELF-CHECKOUT</title>
  <!-- バーコードリーダーライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <!-- QRコード生成ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background-color: #f7f9fc; color: #333333; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    h1 { color: #2575fc; margin: 0; font-size: 24px; }
    .settings-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0; color: #555; }
    .status { text-align: center; color: #2575fc; margin-bottom: 10px; font-weight: bold; }
    #interactive.viewport, #register-viewport.viewport { width: 100%; height: 250px; background-color: #000; border: 2px solid #2575fc; border-radius: 10px; overflow: hidden; margin-bottom: 20px; position: relative; }
    #interactive.viewport video, #register-viewport.viewport video { width: 100%; height: 100%; object-fit: cover; }
    h2 { font-size: 18px; color: #444; margin-top: 20px; }
    .cart { background: #ffffff; padding: 15px; border-radius: 10px; min-height: 120px; border: 1px solid #e0e0e0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
    .total { font-size: 22px; font-weight: bold; text-align: right; margin-top: 15px; color: #ff4757; }
    .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .pay-btn { background-color: #ff4757; }
    .undo-btn { background-color: #ffa502; }
    .share-btn { background-color: #00b894; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 100; }
    .receipt { background: #ffffff; color: #333333; font-family: 'Courier New', monospace; padding: 25px; width: 320px; max-height: 80vh; overflow-y: auto; border-radius: 10px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .receipt h2 { text-align: center; margin: 0 0 10px 0; font-size: 20px; font-family: 'Segoe UI', sans-serif; color: #333; }
    .receipt-item { display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; }
    .close-btn { width: 100%; padding: 10px; margin-top: 15px; background: #e0e0e0; color: #333; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; font-family: 'Segoe UI', sans-serif; }
    .staff-box { background: #ff4757; color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-family: 'Segoe UI', sans-serif; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; }
    #qrcode img { border: 5px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .view-container { display: none; }
    .view-container.active { display: block; }
  </style>
</head>
<body>

  <!-- ================= お客様画面 ================= -->
  <div id="customer-view" class="view-container active">
    <div class="header-container">
      <h1>SELF-CHECKOUT</h1>
      <button class="settings-btn" onclick="openSettings()" title="設定">⚙️</button>
    </div>
    
    <div class="status" id="status-msg">カメラにバーコードにかざしてください</div>
    <div id="interactive" class="viewport"></div>

    <h2>購入リスト</h2>
    <div class="cart" id="cart-list"><p style="color: #888; font-family: 'Segoe UI', sans-serif;">スキャンした商品がここに表示されます</p></div>
    <div class="total">合計 (税込): <span id="total-price">0</span> 円</div>

    <button class="btn undo-btn" onclick="removeLastItem()">直前のスキャンを取り消す</button>
    <button class="btn pay-btn" onclick="openPaymentModal()">お会計</button>
  </div>

  <!-- ================= レジ操作画面（別ページ風） ================= -->
  <div id="register-view" class="view-container">
    <div class="header-container">
      <h1>レジ操作モード</h1>
      <button class="settings-btn" onclick="switchView('customer')" title="お客様画面へ戻る">🔙</button>
    </div>
    <div class="status">お客様のスマホに表示されたQRコードを読み取ってください</div>
    <div id="register-viewport" class="viewport"></div>
    <button class="btn" style="background-color: #555;" onclick="switchView('customer')">お客様画面に戻る</button>
  </div>

  <!-- お会計・QRコード画面（お客様用） -->
  <div class="modal-overlay" id="payment-modal">
    <div class="receipt">
      <div class="staff-box">
        <h2 style="color: white; margin: 0; font-size: 18px;">お会計QRコード</h2>
      </div>
      <p style="font-size: 22px; font-weight: bold; margin: 10px 0; color: #ff4757; font-family: 'Segoe UI', sans-serif;"><span id="pay-amount">0</span> 円</p>
      <div id="qrcode"></div>
      <p style="font-size: 12px; color: #666; margin: 5px 0; font-family: 'Segoe UI', sans-serif;">このQRコードをレジカメラにかざしてください</p>
      <button class="close-btn" onclick="closePaymentModal()">閉じる</button>
    </div>
  </div>

  <!-- レジ側：お会計確認画面 -->
  <div class="modal-overlay" id="register-confirm-modal">
    <div class="receipt" style="text-align: left;">
      <h2>お会計内容確認</h2>
      <div id="register-confirm-items" style="margin: 10px 0; max-height: 150px; overflow-y:auto;"></div>
      <hr style="border: none; border-top: 1px dashed #ccc; margin: 10px 0;">
      <div id="register-confirm-total" style="font-weight:bold; text-align:right; font-size: 18px; color: #ff4757;"></div>
      <button class="btn pay-btn" style="margin-top:15px; padding:10px; font-size:16px;" onclick="completeRegisterPayment()">完了してレシート表示</button>
      <button class="close-btn" onclick="closeRegisterConfirm()">キャンセル</button>
    </div>
  </div>

  <!-- レジ側：レシート表示画面 -->
  <div class="modal-overlay" id="receipt-modal">
    <div class="receipt">
      <h2>レシート</h2>
      <div id="receipt-items"></div>
      <hr style="border: none; border-top: 1px dashed #ccc; margin: 10px 0;">
      <div id="receipt-total" style="font-weight:bold; text-align:right;"></div>
      
      <!-- レシート下の共有ボタン -->
      <button class="btn share-btn" style="padding:10px; font-size:16px; margin-top:15px;" onclick="shareReceipt()">レシートを共有する</button>
      <button class="close-btn" onclick="closeReceipt()">閉じる</button>
    </div>
  </div>

  <!-- 設定・管理画面（パスワード保護） -->
  <div class="modal-overlay" id="settings-modal">
    <div class="receipt" style="text-align: left; font-family: 'Segoe UI', sans-serif;">
      <h2>管理設定</h2>
      <div style="margin-top: 15px;">
        <button class="btn" style="background-color: #2575fc; margin-top:5px; font-size:15px; padding:10px;" onclick="switchToRegisterMode()">レジ操作モードへ切替</button>
        <button class="btn" style="background-color: #00adb5; margin-top:10px; font-size:15px; padding:10px;" onclick="showSalesHistory()">売上履歴を見る</button>
        <button class="btn" style="background-color: #ffa502; margin-top:10px; font-size:15px; padding:10px;" onclick="resetSalesOnly()">売上記録のみリセット</button>
        <button class="btn" style="background-color: #ff4757; margin-top:10px; font-size:15px; padding:10px;" onclick="resetAllData()">すべてのデータをリセット</button>
      </div>
      <button class="close-btn" onclick="closeSettings()" style="margin-top: 20px;">閉じる</button>
    </div>
  </div>

  <!-- 売上履歴画面 -->
  <div class="modal-overlay" id="history-modal">
    <div class="receipt" style="text-align: left; font-family: 'Segoe UI', sans-serif;">
      <h2>売上履歴</h2>
      <div id="history-list" style="max-height: 250px; overflow-y: auto; margin-top: 10px; font-size: 13px;"></div>
      <button class="close-btn" onclick="closeHistory()">戻る</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 🛒 商品データ
    // ==========================================
    let itemDatabase = JSON.parse(localStorage.getItem('myPosDatabase')) || {
      "4901330502880": { name: "ポテトチップス", price: 160 },
      "4902105001569": { name: "カップヌードル", price: 210 },
      "4902402928837": { name: "とんがりCORN", price: 150 },
      "958412687453": { name: "コーラ", price: 350 }
    };

    const SALES_PASSWORD = "4869"; // 管理用パスワード
    let canScan = true, totalPrice = 0, isFirst = true, cartHistory = []; 
    let salesHistory = JSON.parse(localStorage.getItem('myPosSalesHistory')) || [];
    let scannedCartDataForRegister = null; // レジ側で読み取った一時データ

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(freq, duration, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    // 画面切り替え管理
    function switchView(viewName) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      if (viewName === 'customer') {
        document.getElementById('customer-view').classList.add('active');
        stopRegisterScanner();
        startCustomerScanner();
      } else if (viewName === 'register') {
        document.getElementById('register-view').classList.add('active');
        stopCustomerScanner();
        startRegisterScanner();
      }
    }

    // 設定ボタン（⚙️）押下時
    function openSettings() {
      const input = prompt("管理用パスワードを入力してください");
      if (input !== SALES_PASSWORD) { 
        if (input !== null) alert("パスワードが違います"); 
        return; 
      }
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    function closePaymentModal() { document.getElementById('payment-modal').style.display = 'none'; }
    function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }
    function closeRegisterConfirm() { document.getElementById('register-confirm-modal').style.display = 'none'; }
    function closeReceipt() { 
      document.getElementById('receipt-modal').style.display = 'none'; 
      cartHistory = [];
      totalPrice = 0;
      isFirst = true;
      document.getElementById('cart-list').innerHTML = '<p style="color: #888; font-family: \'Segoe UI\', sans-serif;">スキャンした商品がここに表示されます</p>';
      document.getElementById('total-price').textContent = '0';
      switchView('customer');
    }

    function switchToRegisterMode() {
      closeSettings();
      switchView('register');
    }

    function addItem(name, price) {
      playSound(1200, 0.08);
      if (isFirst) { document.getElementById('cart-list').innerHTML = ''; isFirst = false; }
      const taxPrice = Math.round(price * 1.1);
      const itemEl = document.createElement('p');
      itemEl.style.margin = "5px 0";
      itemEl.textContent = `▶ ${name} : ${price}円 (税込${taxPrice}円)`;
      cartHistory.push({ name: name, price: price, taxPrice: taxPrice, element: itemEl });
      document.getElementById('cart-list').appendChild(itemEl);
      totalPrice += taxPrice;
      document.getElementById('total-price').textContent = totalPrice;
    }

    function removeLastItem() {
      if (cartHistory.length > 0) {
        const last = cartHistory.pop();
        last.element.remove();
        totalPrice -= last.taxPrice;
        document.getElementById('total-price').textContent = totalPrice;
      }
    }

    // お会計ボタン押下時（QRコード生成：LUCKY_バーコード_金額 形式）
    function openPaymentModal() {
      if (cartHistory.length === 0) {
        alert("商品がスキャンされていません。");
        return;
      }
      document.getElementById('pay-amount').textContent = totalPrice;
      
      // 購入した商品のバーコード一覧を抽出して連結
      // カート内にはバーコード保持していないため、itemDatabaseから逆引きまたはコード配列を生成
      let codes = cartHistory.map(item => {
        for (let code in itemDatabase) {
          if (itemDatabase[code].name === item.name) return code;
        }
        return "00000";
      });

      const qrData = `LUCKY_${codes.join('_')}_${totalPrice}`;
      
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";
      try {
        const qr = qrcode(0, 'M');
        qr.addData(qrData);
        qr.make();
        qrContainer.innerHTML = qr.createImgTag(4);
      } catch (e) {
        qrContainer.innerHTML = "QRコード生成エラー";
      }

      document.getElementById('payment-modal').style.display = 'flex';
    }

    // レジ側での決済完了処理
    function completeRegisterPayment() {
      document.getElementById('register-confirm-modal').style.display = 'none';
      
      if (!scannedCartDataForRegister) return;

      const container = document.getElementById('receipt-items');
      container.innerHTML = scannedCartDataForRegister.items.map(i => `<div class="receipt-item"><span>${i.name}</span><span>${i.taxPrice}円</span></div>`).join('');
      document.getElementById('receipt-total').textContent = `合計: ${scannedCartDataForRegister.total}円`;
      document.getElementById('receipt-modal').style.display = 'flex';
      
      const itemsPurchased = scannedCartDataForRegister.items.map(i => `${i.name} (${i.taxPrice}円)`).join(', ');
      salesHistory.push({ date: new Date().toLocaleString(), total: scannedCartDataForRegister.total, items: itemsPurchased });
      localStorage.setItem('myPosSalesHistory', JSON.stringify(salesHistory));
    }

    // レシート共有機能
    function shareReceipt() {
      if (navigator.share) {
        navigator.share({
          title: 'レシート',
          text: `お買い上げ合計: ${document.getElementById('receipt-total').textContent}`
        }).catch(err => console.log('共有キャンセル'));
      } else {
        alert("お使いのブラウザは共有機能に対応していません。");
      }
    }

    // 売上履歴表示
    function showSalesHistory() {
      const historyContainer = document.getElementById('history-list');
      if (salesHistory.length === 0) {
        historyContainer.innerHTML = "履歴はありません";
      } else {
        historyContainer.innerHTML = salesHistory.map(s => {
          const itemList = s.items ? `<br><small style="color:#666;">内訳: ${s.items}</small>` : '';
          return `<div style="margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 5px;">
                    <strong>${s.date}</strong><br>
                    合計: ${s.total}円 ${itemList}
                  </div>`;
        }).join('');
      }
      document.getElementById('settings-modal').style.display = 'none';
      document.getElementById('history-modal').style.display = 'flex';
    }

    function resetSalesOnly() { 
      if(confirm("売上記録を削除しますか？")){ 
        localStorage.removeItem('myPosSalesHistory'); 
        salesHistory = [];
        alert("売上記録をリセットしました。");
        closeSettings(); 
      } 
    }
    
    function resetAllData() { 
      if(confirm("すべてのデータをリセットしますか？")){ 
        localStorage.clear(); 
        location.reload(); 
      } 
    }

    // ==========================================
    // 📷 カメラ（QuaggaJS）制御：お客様画面用
    // ==========================================
    function startCustomerScanner() {
      Quagga.init({
        inputStream: { 
          type: "LiveStream", 
          target: document.querySelector('#interactive'), 
          constraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
        },
        decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader", "code_39_reader"], multiple: false },
        locate: true
      }, (err) => { 
        if (!err) Quagga.start(); 
      });

      Quagga.onDetected(customerScanHandler);
    }

    function stopCustomerScanner() {
      try { Quagga.offDetected(customerScanHandler); Quagga.stop(); } catch(e){}
    }

    function customerScanHandler(res) {
      if (!canScan) return;
      const code = res.codeResult.code;
      canScan = false;

      if (itemDatabase[code]) {
        addItem(itemDatabase[code].name, itemDatabase[code].price);
      } else {
        playSound(300, 0.2, 'sawtooth');
        alert(`❌ エラー: 未登録のバーコードです\n番号: ${code}`);
      }
      setTimeout(() => { canScan = true; }, 1500);
    }

    // ==========================================
    // 📷 カメラ（QuaggaJS）制御：レジ操作画面用（QRコード用またはバーコード用）
    // ==========================================
    function startRegisterScanner() {
      // レジ側でのカメラ起動（簡易的に通常のストリームとして初期化）
      Quagga.init({
        inputStream: { 
          type: "LiveStream", 
          target: document.querySelector('#register-viewport'), 
          constraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
        },
        decoder: { readers: ["ean_reader", "code_128_reader"], multiple: false }
      }, (err) => { 
        if (!err) Quagga.start(); 
      });
      Quagga.onDetected(registerScanHandler);
    }

    function stopRegisterScanner() {
      try { Quagga.offDetected(registerScanHandler); Quagga.stop(); } catch(e){}
    }

    function registerScanHandler(res) {
      const code = res.codeResult.code;
      // お客様画面のQRコードフォーマット（LUCKY_...）を検知したと仮定したシミュレーション処理
      if (code && code.startsWith("LUCKY_")) {
        playSound(1200, 0.1);
        const parts = code.split("_");
        const totalPriceVal = parts[parts.length - 1];
        const itemCodes = parts.slice(1, parts.length - 1);

        let parsedItems = [];
        itemCodes.forEach(c => {
          if (itemDatabase[c]) {
            parsedItems.push({ name: itemDatabase[c].name, taxPrice: Math.round(itemDatabase[c].price * 1.1) });
          }
        });

        scannedCartDataForRegister = { items: parsedItems, total: totalPriceVal };

        // 確認画面に反映
        document.getElementById('register-confirm-items').innerHTML = parsedItems.map(i => `<div class="receipt-item"><span>${i.name}</span><span>${i.taxPrice}円</span></div>`).join('');
        document.getElementById('register-confirm-total').textContent = `合計: ${totalPriceVal}円`;
        document.getElementById('register-confirm-modal').style.display = 'flex';
      }
    }

    // 初期起動はお客様画面
    startCustomerScanner();
  </script>
</body>
  </html>
