<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELF-CHECKOUT</title>
  <!-- バーコード読み取りライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #1a1a2e;
      color: #ffffff;
      border-radius: 15px;
    }
    h1 { text-align: center; color: #00fff5; margin-bottom: 5px; }
    
    #interactive.viewport {
      width: 100%;
      height: 250px;
      background-color: #000;
      border: 2px solid #00fff5;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    #interactive.viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cart {
      background: #0f3460;
      padding: 15px;
      border-radius: 10px;
      min-height: 120px;
      border: 1px solid #00fff5;
    }
    .total {
      font-size: 22px;
      font-weight: bold;
      text-align: right;
      margin-top: 15px;
      color: #ff2e63;
    }
    .btn {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
    .pay-btn { background-color: #ff2e63; }
    .pay-btn:hover { background-color: #e01e4f; }
    .undo-btn { background-color: #ff9900; }
    .undo-btn:hover { background-color: #e68a00; }
    .history-btn { background-color: #00adb5; }
    .history-btn:hover { background-color: #008891; }
    
    .reset-btn {
      display: block;
      margin: 15px auto 0;
      background: transparent;
      color: #888;
      border: 1px solid #555;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
    }
    .reset-btn:hover { color: #fff; border-color: #888; }
    .status { text-align: center; color: #00fff5; margin-bottom: 10px; }

    /* モーダル（レシート・履歴用） */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .receipt {
      background: #ffffff;
      color: #333333;
      font-family: 'Courier New', Courier, monospace;
      padding: 25px;
      width: 300px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 5px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    .receipt h2 { text-align: center; margin: 0 0 10px 0; font-size: 20px; }
    .receipt-line { border-bottom: 1px dashed #666; margin: 10px 0; }
    .receipt-item { display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; }
    .receipt-total { font-size: 18px; font-weight: bold; text-align: right; margin-top: 10px; }
    .close-btn {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #333;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>SELF-CHECKOUT</h1>
  <div class="status" id="status-msg">カメラにかざしてください</div>

  <!-- カメラ映像 -->
  <div id="interactive" class="viewport"></div>

  <h2>購入リスト</h2>
  <div class="cart" id="cart-list">
    <p style="color: #888;">スキャンした商品がここに表示されます</p>
  </div>

  <div class="total">
    合計 (税込): <span id="total-price">0</span> 円
  </div>

  <button class="btn undo-btn" onclick="removeLastItem()">↩️ 直前のスキャンを取り消す</button>
  <button class="btn pay-btn" onclick="pay()">お会計する</button>
  <button class="btn history-btn" onclick="showSalesHistory()">📊 売上履歴（記録）を見る</button>
  <button class="reset-btn" onclick="resetDatabase()">登録した商品データを初期化</button>

  <!-- 🧾 レシート表示ポップアップ -->
  <div class="modal-overlay" id="receipt-modal">
    <div class="receipt">
      <h2>RECEIPT</h2>
      <div style="text-align: center; font-size: 12px; color: #666;" id="receipt-date"></div>
      <div class="receipt-line"></div>
      <div id="receipt-items"></div>
      <div class="receipt-line"></div>
      <div class="receipt-total" id="receipt-total-price"></div>
      <div style="text-align: center; margin-top: 15px; font-size: 12px;">ありがとうございました！</div>
      <button class="close-btn" onclick="closeReceipt()">閉じる</button>
    </div>
  </div>

  <!-- 📊 売上履歴ポップアップ -->
  <div class="modal-overlay" id="history-modal">
    <div class="receipt">
      <h2>SALES HISTORY</h2>
      <div style="text-align: center; font-size: 12px; color: #666;">これまでの売上記録</div>
      <div class="receipt-line"></div>
      <div id="history-list"></div>
      <div class="receipt-line"></div>
      <div class="receipt-total" id="history-grand-total"></div>
      <button class="close-btn" onclick="closeHistory()">閉じる</button>
    </div>
  </div>

  <script>
    let totalPrice = 0;
    let isFirst = true;
    let canScan = true;
    let cartHistory = []; 

    const defaultData = {
      "4901330502880": { name: "ポテトチップス", price: 160 },
      "4902102072618": { name: "コカ・コーラ 500ml", price: 150 },
      "4901085089330": { name: "お〜いお茶 525ml", price: 140 }
    };

    let itemDatabase = JSON.parse(localStorage.getItem('myPosDatabase')) || defaultData;
    // 📊 売上記録用のデータ保存場所
    let salesHistory = JSON.parse(localStorage.getItem('myPosSalesHistory')) || [];

    function playSound(freq, duration, type = 'sine') {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playScanSound() { playSound(1200, 0.08); }
    function playNewItemSound() { playSound(800, 0.1); setTimeout(() => playSound(1000, 0.1), 150); }
    function playErrorSound() { playSound(220, 0.15, 'sawtooth'); }

    function addItem(name, price) {
      playScanSound();
      const cartList = document.getElementById('cart-list');
      if (isFirst) { cartList.innerHTML = ''; isFirst = false; }
      
      const taxPrice = Math.round(price * 1.1);
      const itemEl = document.createElement('p');
      itemEl.style.margin = '5px 0';
      itemEl.textContent = `▶ ${name} : ${price}円 (税込${taxPrice}円)`;
      cartList.appendChild(itemEl);
      
      cartHistory.push({ name: name, price: price, taxPrice: taxPrice, element: itemEl });
      totalPrice += taxPrice;
      document.getElementById('total-price').textContent = totalPrice;
    }

    function removeLastItem() {
      if (cartHistory.length === 0) { playErrorSound(); alert('商品がありません'); return; }
      playErrorSound();
      const last = cartHistory.pop();
      last.element.remove();
      totalPrice -= last.taxPrice;
      document.getElementById('total-price').textContent = totalPrice;
      if (cartHistory.length === 0) {
        document.getElementById('cart-list').innerHTML = '<p style="color: #888;">スキャンした商品がここに表示されます</p>';
        isFirst = true;
      }
      document.getElementById('status-msg').textContent = "1つ取り消しました";
    }

    Quagga.init({
      inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#interactive') },
      decoder: { readers: ["ean_reader"] }
    }, function(err) { if (!err) Quagga.start(); });

    Quagga.onDetected(function(result) {
      if (!canScan) return;
      const code = result.codeResult.code;

      if (itemDatabase[code]) {
        addItem(itemDatabase[code].name, itemDatabase[code].price);
        document.getElementById('status-msg').textContent = `読み取り成功！: ${itemDatabase[code].name}`;
        canScan = false;
        setTimeout(() => { canScan = true; }, 1500);
      } else {
        canScan = false;
        playNewItemSound();
        const newName = prompt(`【新規商品】商品名を入力してください:`);
        if (newName) {
          const newPrice = Number(prompt(`価格（税抜き）を入力:`));
          if (!isNaN(newPrice) && newPrice > 0) {
            itemDatabase[code] = { name: newName, price: newPrice };
            localStorage.setItem('myPosDatabase', JSON.stringify(itemDatabase));
            addItem(newName, newPrice);
          }
        }
        setTimeout(() => { canScan = true; }, 2000);
      }
    });

    // 💳 お会計＆記録の保存
    function pay() {
      if (cartHistory.length === 0) {
        playErrorSound();
        alert('商品が選ばれていません');
        return;
      }
      playScanSound();

      const now = new Date();
      const dateStr = now.toLocaleString('ja-JP');

      // 📊 売上記録に追加して保存！
      const saleRecord = {
        date: dateStr,
        items: cartHistory.map(i => ({ name: i.name, price: i.taxPrice })),
        total: totalPrice
      };
      salesHistory.push(saleRecord);
      localStorage.setItem('myPosSalesHistory', JSON.stringify(salesHistory));

      // レシート表示
      document.getElementById('receipt-date').textContent = dateStr;
      const container = document.getElementById('receipt-items');
      container.innerHTML = '';
      cartHistory.forEach(item => {
        const row = document.createElement('div');
        row.className = 'receipt-item';
        row.innerHTML = `<span>${item.name}</span><span>￥${item.taxPrice}</span>`;
        container.appendChild(row);
      });

      document.getElementById('receipt-total-price').textContent = `合計 (税込): ￥${totalPrice}`;
      document.getElementById('receipt-modal').style.display = 'flex';
    }

    function closeReceipt() {
      document.getElementById('receipt-modal').style.display = 'none';
      location.reload();
    }

    // 📊 売上履歴を表示する機能
    function showSalesHistory() {
      playScanSound();
      const container = document.getElementById('history-list');
      container.innerHTML = '';

      if (salesHistory.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888;">まだお会計の記録がありません</p>';
        document.getElementById('history-grand-total').textContent = '累計売上: ￥0';
      } else {
        let grandTotal = 0;
        salesHistory.forEach((sale, index) => {
          grandTotal += sale.total;
          const block = document.createElement('div');
          block.style.marginBottom = '15px';
          block.innerHTML = `
            <div style="font-size: 10px; color: #666;">#${index + 1} - ${sale.date}</div>
            ${sale.items.map(i => `<div class="receipt-item"><span>${i.name}</span><span>￥${i.price}</span></div>`).join('')}
            <div style="text-align: right; font-weight: bold; font-size: 13px; margin-top: 3px;">小計: ￥${sale.total}</div>
          `;
          container.appendChild(block);
        });
        document.getElementById('history-grand-total').textContent = `累計売上: ￥${grandTotal}`;
      }

      document.getElementById('history-modal').style.display = 'flex';
    }

    function closeHistory() {
      document.getElementById('history-modal').style.display = 'none';
    }

    function resetDatabase() {
      playErrorSound();
      if (confirm('商品データと売上記録をすべてリセットしますか？')) {
        localStorage.removeItem('myPosDatabase');
        localStorage.removeItem('myPosSalesHistory');
        location.reload();
      }
    }
  </script>
</body>
</html>
